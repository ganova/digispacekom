name: digispacekom

# Nilai ${...} dibaca dari file .env di folder ini (lihat .env.example).
# Pengembangan: docker compose up -d
# Server klien: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    build: ./docker/php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8095}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SITE_WHATSAPP: ${SITE_WHATSAPP:-6281385028980}
      SITE_PHONE: ${SITE_PHONE:-0813-8502-8980}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: digispacekom
      DB_USERNAME: digispacekom
      DB_PASSWORD: ${DB_PASSWORD:-digispacekom}
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8095}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: digispacekom
      MARIADB_USER: digispacekom
      MARIADB_PASSWORD: ${DB_PASSWORD:-digispacekom}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  vendor:
  dbdata:
