name: digispacekom

services:
  app:
    build: ./docker/php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: digispacekom
      DB_USERNAME: digispacekom
      DB_PASSWORD: digispacekom
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: digispacekom
      MARIADB_USER: digispacekom
      MARIADB_PASSWORD: digispacekom
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  vendor:
  dbdata:
